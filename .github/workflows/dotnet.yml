name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-publish:

    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2. Setup .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # 3. Restore
      - name: Restore dependencies
        run: dotnet restore source/TechTeaStudio.Config/TechTeaStudio.Config.sln

      # 4. Build
      - name: Build
        run: dotnet build --no-restore

      # 5. Test
      - name: Test
        run: dotnet test --no-build --verbosity normal

      - name: Extract versions
        id: get-versions
        run: |
          mkdir -p artifacts
          for proj in source/*/*.csproj; do
            VERSION=$(grep -Po '(?<=<Version>)[^<]+' "$proj")
            echo "Packing $proj version $VERSION"
            dotnet pack "$proj" \
              --configuration Release \
              --output ./artifacts \
              --no-build \
              /p:PackageVersion=$VERSION
      
      - name: Push all NuGet packages
        run: |
          for pkg in ./artifacts/*.nupkg; do
            echo "Pushing $pkg"
            dotnet nuget push "$pkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --skip-duplicate

