name: .NET

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  publish:
    uses: TechTeaStudio/.github/.github/workflows/nuget-publish-reusable.yml@main
    with:
      solution: source/TechTeaStudio.Config/TechTeaStudio.Config.sln
      projects_glob: source/*/*.csproj
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
